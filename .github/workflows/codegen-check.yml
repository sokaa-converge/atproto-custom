name: codegen-check

on:
  pull_request:
    branches:
      - main
    paths:
      - 'lexicons/**'
      - 'packages/lex-cli/src/**'

jobs:
  codegen-check:
    name: Verify generated files are up to date
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build lex-cli and its workspace dependencies
        # In a fresh CI checkout no dist/ directories exist. The ...pkg syntax
        # tells pnpm to build pkg AND all of its workspace dependencies in
        # topological order: @atproto/common-web → syntax → lexicon → lex-cli.
        run: pnpm --filter "...@atproto/lex-cli" build

      - name: Run PDS codegen
        run: pnpm --filter @atproto/pds codegen

      - name: Fail if generated files are stale
        run: |
          # git diff catches modified files; git status --porcelain also catches
          # new untracked files (e.g. a brand-new lexicon's generated type file).
          if [ -n "$(git status --porcelain)" ]; then
            echo ""
            echo "Generated files are out of date."
            echo "Run 'pnpm --filter @atproto/pds codegen' locally and commit the result."
            echo ""
            git status --short
            git diff --stat
            exit 1
          fi
          echo "Generated files are up to date."
